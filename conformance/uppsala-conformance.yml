    endpoint. It is registered by SWAMID (mdrpi:RegistrationInfo registrationAuthority
    http://www.swamid.se/, registrationInstant 2013-10-28T12:07:42Z, RegistrationPolicy
    http://swamid.se/policy/mdrps) and therefore also reachable via eduGAIN.
  location: https://weblogin.uu.se/idp/shibboleth
