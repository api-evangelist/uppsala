- aid: uppsala:idp-saml
  name: Uppsala University SAML 2.0 Identity Provider Metadata
  x-operator: institution
  x-operator-evidence: >-
    Host weblogin.uu.se is under the university's own registrable domain. The document served is a
    SAML 2.0 md:EntityDescriptor with entityID https://weblogin.uu.se/idp/shibboleth, an
    mdrpi:RegistrationInfo naming registrationAuthority http://www.swamid.se/ (the Swedish research
    and education federation) with registrationInstant 2013-10-28, and mdui:DisplayName "Uppsala
    universitet" / "Uppsala University". Probed 2026-08-30, HTTP 200.
  description: >-
    Uppsala University runs its own Shibboleth Identity Provider and publishes its SAML 2.0 federation
    metadata as a machine-readable EntityDescriptor. It is registered in SWAMID, the Swedish identity
    federation for research and higher education, and therefore reachable through eduGAIN. The document
    advertises SingleSignOnService over HTTP-POST and HTTP-Redirect, SingleLogoutService over
    Redirect, POST and SOAP, and ArtifactResolution over SOAP. This is one of the few genuinely
    institution-operated, machine-readable, standards-conformant surfaces most universities run, and
    it is almost never catalogued.
  humanURL: https://weblogin.uu.se/english.html
  baseURL: https://weblogin.uu.se/idp/
