---
aid: uppsala
name: Uppsala University
description: >-
  Uppsala University (Uppsala universitet) is Sweden's oldest university, founded in 1477, and a
  public research university ranked #103 in the QS World University Rankings 2025. It operates no
  central developer portal and no institution-wide open-data portal — data.uu.se, opendata.uu.se and
  api.uu.se do not resolve — so its programmable footprint is decentralized, sitting inside individual
  research infrastructures, the university library, and IT services. Four surfaces were verified live
  as institution-operated: the Uppsala Conflict Data Program (UCDP) REST API at ucdpapi.pcr.uu.se,
  which is the university's most substantial public API and requires a free token; the Norse World
  REST-API at norseworld.nordiska.uu.se, returning JSON, GeoJSON and JSON-LD; the DiVA OAI-PMH
  endpoint at uu.diva-portal.org, notable because Uppsala University Library builds and hosts the
  DiVA platform for the whole Swedish DiVA consortium rather than renting it from a vendor; and the
  university's SWAMID-registered Shibboleth SAML 2.0 identity provider at weblogin.uu.se, which
  publishes machine-readable federation metadata. No Figshare, Elsevier Pure, Ex Libris or Dataverse
  contract is attributed to Uppsala in this profile.
