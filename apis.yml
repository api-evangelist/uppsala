x-coverage:
  state: covered
  reason: covered
  detail: >-
    Uppsala operates real, first-party machine-readable surfaces and all of them were reached live.
    The UCDP API answers 401 without the free x-ucdp-access-token header, which is the documented
    behaviour and grades live rather than dead. Norse World returns application/json and valid
    GeoJSON. DiVA answers a full OAI-PMH 2.0 Identify with adminEmail diva-support@ub.uu.se, eight
    metadata prefixes and eight sets. weblogin.uu.se serves a signed SAML 2.0 EntityDescriptor
    registered by SWAMID. What Uppsala does NOT have is a central developer portal or an open-data
    portal: data.uu.se, opendata.uu.se and api.uu.se do not resolve, and the course catalog at
    uu.se/en/study/course is a human-readable listing with no published API. The /.well-known/
    security.txt served on uu.se is the SiteVision CMS vendor's boilerplate (contact
    soc@sitevision.se), not an Uppsala vulnerability-disclosure programme, and is recorded as
    x-operator vendor so it is not credited to the institution.
  evidence:
