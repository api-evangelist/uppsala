- aid: uppsala:norseworld
  name: Norse World REST-API
  x-operator: institution
  x-operator-evidence: >-
    Host norseworld.nordiska.uu.se is under the university's own registrable domain uu.se, run by the
    Department of Scandinavian Languages. Probed 2026-08-30: 200 with Content-Type application/json
    and a valid GeoJSON FeatureCollection.
  description: >-
    The Norse World REST-API, part of the Norse World research infrastructure at Uppsala University's
    Department of Scandinavian Languages, provides access to attestation and location records of foreign
    place names in medieval Nordic texts. Endpoints (getAttestationAPI.php and getLocationAPI.php) return
    data as JSON, GeoJSON, or JSON-LD via a ?format= parameter and are usable directly from a URL or GIS
    tools.
  humanURL: https://www.uu.se/en/research/norseworld/infrastructure/rest-api
  baseURL: https://norseworld.nordiska.uu.se/shared/
