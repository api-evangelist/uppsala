- aid: uppsala:diva-oai
  name: DiVA OAI-PMH
  x-operator: institution
  x-operator-evidence: >-
    diva-portal.org is not a vendor tenancy Uppsala rents — the DiVA platform is developed and hosted
    by Uppsala University Library for the Swedish DiVA consortium, and the live Identify response
    names diva-support@ub.uu.se (Uppsala University Library) as adminEmail. Uppsala is the operator
    here; other Swedish institutions on *.diva-portal.org are the tenants.
  description: >-
    DiVA (Academic Archive On-line) is Uppsala University Library's institutional repository for publications
    and research data produced by the university's researchers and students. It exposes an OAI-PMH 2.0
    endpoint for harvesting publication metadata. A live Identify on 2026-08-30 returned repositoryName
    "DiVA - Academic Archive On-line", repositoryIdentifier DiVA.org, granularity YYYY-MM-DDThh:mm:ssZ
    and deletedRecord persistent; ListMetadataFormats returned oai_dc, oai_etdms, marc21,
    marc21electronic, swepub_mods, uppsok, gmd and mets_kb.
  humanURL: https://www.uu.se/en/library/publish/diva
  baseURL: https://uu.diva-portal.org/dice/oai
  tags:
