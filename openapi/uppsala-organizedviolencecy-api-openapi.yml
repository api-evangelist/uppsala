        in: path
        required: true
        schema:
          type: string
      - name: pagesize
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: Country
        in: query
        schema:
          type: string
      - name: Country_Id
        in: query
        schema:
          type: string
      - name: Year
        in: query
        schema:
          type: string
      - name: Region
        in: query
        schema:
          type: string
      - name: Govt_name
        in: query
        schema:
          type: string
      - name: Sb_exist
        in: query
