          type: string
      - name: Os_exist
        in: query
        schema:
          type: string
      - name: Key
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OrganizedViolenceCYDbAPIResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizedViolenceCYDbAPIResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/OrganizedViolenceCYDbAPIResponse'
      summary: Get api organizedviolencecy by version
      x-summary-source: derived
      operationId: getApiOrganizedviolencecyByVersion
      x-operation-id-source: derived
